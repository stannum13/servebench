services:
  router:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      MODEL: ${MODEL:-Qwen/Qwen2.5-7B-Instruct}
      VLLM_BASE_URL: http://vllm:8000
      ROUTER_POLICY: ${ROUTER_POLICY:-fifo}
      ALLOW_POLICY_OVERRIDE: ${ALLOW_POLICY_OVERRIDE:-false}
      ROUTER_API_KEY: ${ROUTER_API_KEY:-}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
  vllm:
    image: vllm/vllm-openai:v0.18.0
    command: ["--model", "${MODEL:-Qwen/Qwen2.5-7B-Instruct}", "${PREFIX_CACHE_FLAG:---enable-prefix-caching}", "${CHUNKED_PREFILL_FLAG:---enable-chunked-prefill}", "--max-num-batched-tokens", "${MAX_BATCHED_TOKENS:-8192}", "--max-num-seqs", "${MAX_SEQS:-256}", "--dtype", "${DTYPE:-bfloat16}"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["hf-cache:/root/.cache/huggingface"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    volumes:
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.4.1-4.5.2-ubuntu22.04
    cap_add: [SYS_ADMIN]
    ports: ["127.0.0.1:9400:9400"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  experiment-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["servebench-loadgen"]
    environment:
      ROUTER_API_KEY: ${ROUTER_API_KEY:-}
    command: ["--url", "http://router:8080", "--workload", "mixed", "--requests", "100", "--concurrency", "8", "--output", "/results/latest/requests.jsonl"]
    volumes: ["./results:/results"]
    depends_on:
      router:
        condition: service_healthy
    profiles: [tools]
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "webapp.app:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      RESULTS_DIR: /app/results
      REPORT_PATH: /app/REPORT.md
      FIGURES_DIR: /app/figures
    volumes:
      - ./results:/app/results:ro
      - ./figures:/app/figures:ro
      - ./REPORT.md:/app/REPORT.md:ro
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 12
volumes:
  hf-cache: {}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servebench"
version = "0.1.0"
description = "Production-style LLM inference serving benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "prometheus-client>=0.21,<1",
  "pyarrow>=17,<24",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
servebench-loadgen = "loadgen.cli:main"
servebench-experiment = "experiments.runner:main"
servebench-report = "servebench.report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/servebench", "src/router", "src/loadgen", "src/metrics", "src/experiments", "src/mock_backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
